name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip, cache-dependency-path: apps/api/requirements.lock }
      # 跟 Render / Docker 裝同一份 lock，lock 壞掉 CI 會先紅；pip check 確認沒有相依衝突
      - run: pip install -r apps/api/requirements.lock && pip install "pytest>=8,<10" "httpx>=0.27,<1"
      - run: pip check
      - run: python -m pytest -q
        env: { TWIN_DB: /tmp/twin_ci.db }
      - run: python scripts/export_contracts.py --check
      - run: python -m apps.runner batch --scenario balanced --policy all --seeds 2 --budget 4
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
