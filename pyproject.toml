[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waretwin-core"
version = "0.2.0"
description = "Deterministic warehouse coordination experiments"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
pythonpath = ["packages", "apps/api", "."]
testpaths = ["tests", "apps/api/tests"]

